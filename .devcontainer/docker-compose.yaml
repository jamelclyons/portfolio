name: portfolio

services:

  dev-website:
    env_file: .env
    hostname: ${URL}
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        AUTH_TOKEN: ${AUTH_TOKEN}
    platform: linux/arm64
    container_name: portfolio-dev
    image: jamelclyons/portfolio:dev
    restart: unless-stopped
    volumes:
      - ../:/app:cached
      - node_modules:/app/node_modules
      - ${PACKAGES_DIR}:/app/Packages
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      RUNNING_IN_DOCKER: "true"
      DEBUG: true          
      NODE_ENV: development
    networks:
      - j.c.lyons_enterprises
      - seven_tech
      - orb

volumes:
  node_modules:
  
networks:
  j.c.lyons_enterprises:
    name: j.c.lyons_enterprises
    external: true
  seven_tech:
    name: seven_tech
    external: true
  orb:
    name: orb
    external: true
