name: portfolio

services:

  staging-website:
    env_file: .env
    hostname: ${URL}
    build:
      context: .
      dockerfile: Dockerfile.staging
      args:
        AUTH_TOKEN: ${AUTH_TOKEN}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        VITE_GITHUB_TOKEN: ${VITE_GITHUB_TOKEN}
        VITE_GITLAB_TOKEN: ${VITE_GITLAB_TOKEN}
        VITE_GITLAB_API: ${VITE_GITLAB_API}
    platform: linux/arm64
    container_name: portfolio-staging
    image: jamelclyons/portfolio:staging
    restart: unless-stopped
    volumes:
      - ./package-lock.json:/app/package-lock.json:cached
    ports:
      - "5002:5002"
    environment:
      NODE_ENV: staging
      CHOKIDAR_USEPOLLING: "true"
      RUNNING_IN_DOCKER: "true"
    networks:
      - j.c.lyons_enterprises
      - seven_tech
      - orb

networks:
  j.c.lyons_enterprises:
    name: j.c.lyons_enterprises
    external: true
  seven_tech:
    name: seven_tech
    external: true
  orb:
    name: orb
    external: true
